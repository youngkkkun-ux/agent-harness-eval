name: Scheduled Eval

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch: {}    # allow manual runs

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run evaluation (DemoDriver — replace with a real Hermes in your environment)
        run: |
          hermes-eval run --tasks task_library --demo --db eval.db >/dev/null
          hermes-eval report --db eval.db --tasks task_library | tee harness_report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: |
            harness_report.md
            eval.db
          retention-days: 30
